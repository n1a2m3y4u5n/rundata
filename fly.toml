app = "rundata-namyunsu"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:./dev.db"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
